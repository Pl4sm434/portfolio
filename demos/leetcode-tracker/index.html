<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DSA Progress Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1115; --card:#171a21; --border:#262b35; --accent:#4f7cff; --green:#34d399; --text:#e7e9ee; --muted:#8b93a3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Inter', system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding: 40px 24px 16px; max-width: 820px; margin: 0 auto; }
  header h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; font-size: 15px; line-height: 1.5; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 24px 40px; }

  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; flex: 1; min-width: 130px; transition: border-color 0.15s; }
  .stat:hover { border-color: var(--accent); }
  .stat .num { font-size: 26px; font-weight: 800; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 14px; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select {
    background: #0d0f14; border: 1px solid var(--border); color: var(--text);
    padding: 11px 12px; border-radius: 8px; font-family: inherit; font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=text] { flex: 1; min-width: 160px; }
  button {
    background: var(--accent); color: white; border: none; padding: 11px 18px;
    border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 14px;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }

  .topic-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .topic-label { width: 120px; font-size: 13px; color: var(--text); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topic-bar-wrap { flex: 1; height: 8px; background: #0d0f14; border-radius: 999px; overflow: hidden; }
  .topic-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 999px; transition: width 0.3s ease; }
  .topic-count { width: 24px; text-align: right; font-size: 13px; color: var(--muted); }

  ul { list-style: none; padding: 0; margin: 0; }
  li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; transition: border-color 0.15s; }
  li:hover { border-color: var(--accent); }
  li.empty { justify-content: center; color: var(--muted); font-size: 14px; cursor: default; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; margin-left: 8px; }
  .tag.Easy { background: rgba(52,211,153,0.15); color: var(--green); }
  .tag.Medium { background: rgba(234,179,8,0.15); color: #eab308; }
  .tag.Hard { background: rgba(239,68,68,0.15); color: #ef4444; }
  .del { color: var(--muted); cursor: pointer; background: none; padding: 4px 8px; font-weight: 400; }
  .del:hover { color: #ef4444; filter: none; }
</style>
</head>
<body>
<header>
  <h1>🧠 DSA Progress Tracker</h1>
  <p>Log problems as you solve them, keep a real consecutive-day streak, and see which topics you actually need to drill.</p>
</header>
<main>
  <div class="stats">
    <div class="stat"><div class="num" id="totalCount">0</div><div class="label">Total Solved</div></div>
    <div class="stat"><div class="num" id="streakCount">0</div><div class="label">Day Streak</div></div>
    <div class="stat"><div class="num" id="topTopic">–</div><div class="label">Most Practiced Topic</div></div>
  </div>

  <div class="panel">
    <h2>Log a Problem</h2>
    <form id="addForm">
      <input type="text" id="problemName" placeholder="Problem name (e.g. Two Sum)" required />
      <input type="text" id="topic" placeholder="Topic (e.g. Arrays)" required />
      <select id="difficulty">
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
      </select>
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="panel">
    <h2>Topic Breakdown</h2>
    <div id="topicBreakdown"></div>
  </div>

  <ul id="list"></ul>
</main>
<script src="app.js"></script>
</body>
</html>
