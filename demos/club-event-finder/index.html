<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>De Anza CS Club & Event Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1115; --card:#171a21; --border:#262b35; --accent:#4f7cff; --green:#34d399; --text:#e7e9ee; --muted:#8b93a3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Inter', system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding: 40px 24px 16px; max-width: 800px; margin: 0 auto; }
  header h1 { font-size: 28px; font-weight: 800; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; font-size: 15px; line-height: 1.5; }
  .banner { max-width: 800px; margin: 16px auto 8px; padding: 12px 16px; background: rgba(234,179,8,0.12); border: 1px solid rgba(234,179,8,0.35); color: #eab308; font-size: 13px; border-radius: 8px; }
  main { max-width: 800px; margin: 0 auto; padding: 16px 24px 40px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: #0d0f14; color: var(--text); font-family: inherit; font-size: 14px; margin-bottom: 12px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; transition: all 0.15s;
  }
  .chip.active { border-color: var(--accent); color: var(--text); background: rgba(79,124,255,0.12); }
  .result-count { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 10px; transition: border-color 0.15s; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .card .meta { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .tag { display: inline-block; font-size: 11px; background: rgba(79,124,255,0.15); color: var(--accent); padding: 3px 9px; border-radius: 999px; margin-right: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>🗓️ De Anza CS Club & Event Finder</h1>
  <p>A searchable directory of CS-related clubs, workshops, and hackathons at De Anza.</p>
</header>
<div class="banner">
  ⚠️ Placeholder listings — replace with real, current club/event data before sharing publicly (club websites, De Anza's student life page, or Discord servers are good sources).
</div>
<main>
  <input type="text" id="search" placeholder="Search by name, tag, or type (e.g. hackathon, AI, workshop)" />
  <div class="chips" id="typeChips"></div>
  <div class="result-count" id="resultCount"></div>
  <div id="results"></div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
